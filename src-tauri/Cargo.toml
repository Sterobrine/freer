[package]
name = "freer"
version = "0.4.0"
description = "Freer automation GUI shell"
authors = ["Freer"]
edition = "2021"

[lib]
name = "freer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
